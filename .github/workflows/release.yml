name: release
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
permissions:
  contents: read
  packages: write
  id-token: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate the candidate
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r requirements-dev.txt
          .venv/bin/python -m pytest -q
          git clone --filter=blob:none https://github.com/macrocosm-os/apex-competitions-builder ../apex-builder
          git -C ../apex-builder checkout 5a0be85a5975f0948a2d4878597a820c636656e2
          PYTHONPATH=../apex-builder/src .venv/bin/python -m apex_sdk.dev.cli preflight --spec spec.yaml --input fixtures/input.json
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@f713795cb21599bc4e5c4b58cbad1da852d7eeb9
        with:
          cosign-release: v2.5.2
      - name: Build, push, sign, and verify
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          REPOSITORY=${GITHUB_REPOSITORY,,}
          for SIDE in player referee; do
            IMAGE="ghcr.io/${REPOSITORY}-${SIDE}"
            docker build --platform linux/amd64 --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" --push --metadata-file "release/${SIDE}.json" -f "${SIDE}/Dockerfile" -t "${IMAGE}:${GITHUB_REF_NAME}" .
            DIGEST=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["containerimage.digest"])' "release/${SIDE}.json")
            cosign sign --yes "${IMAGE}@${DIGEST}"
            cosign verify --certificate-identity "https://github.com/$GITHUB_WORKFLOW_REF" --certificate-oidc-issuer https://token.actions.githubusercontent.com "${IMAGE}@${DIGEST}" > "release/${SIDE}-verification.json"
          done
          PLAYER_DIGEST=$(python3 -c 'import json; print(json.load(open("release/player.json"))["containerimage.digest"])')
          REFEREE_DIGEST=$(python3 -c 'import json; print(json.load(open("release/referee.json"))["containerimage.digest"])')
          PLAYER_IMAGE="ghcr.io/${REPOSITORY}-player@${PLAYER_DIGEST}"
          REFEREE_IMAGE="ghcr.io/${REPOSITORY}-referee@${REFEREE_DIGEST}"
          docker pull "$PLAYER_IMAGE"
          docker pull "$REFEREE_IMAGE"
          python3 scripts/docker_match.py --player-image "${PLAYER_IMAGE}" --referee-image "${REFEREE_IMAGE}" --submission player/submission.py --episodes 32768 --output release/container-run
          python3 scripts/read_records.py release/container-run/history/episodes.jsonl.gz > release/record-verification.json
          python3 -c 'import json; r=json.load(open("release/container-run/result.json")); assert r["terminal_reason"] == "completed" and r["raw_scores"][0] > 0'
          python3 scripts/finalize_spec.py --repository "$REPOSITORY" --tag "$GITHUB_REF_NAME" --identity "https://github.com/$GITHUB_WORKFLOW_REF" --player release/player.json --referee release/referee.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: signed-release-spec
          path: release/
